context:
  name: ${{ load_from_file("../../pyproject.toml").project.name }}

package:
  name: ${{ name }}
  version: ${{ load_from_file("../../pyproject.toml").project.version }}

source:
  path: ../..
  filter:
    exclude:
      - .pixi

build:
  number: 0
  script:
    content:
      - if: unix
        then: test ! -d .pixi
      - uv pip install --no-deps --no-build-isolation -vv --system .
    env:
      # https://github.com/scikit-build/scikit-build-core/issues/1127#issuecomment-3194377553
      CI: ${{ env.get("CI", default="") }}
  python:
    version_independent: true

requirements:
  build:
    # https://discourse.cmake.org/t/cmake-3-28-cmake-cxx-compiler-clang-scan-deps-notfound-not-found/9244
    - if: osx
      then: clang-tools
    - cmake >=4.0.0
    - ${{ compiler("cxx") }}
    - ninja >=1.11.1,<2.0.0
    - ${{ stdlib("c") }}
    - if: microarch_level | int
      then: x86_64-microarch-level ==${{ microarch_level }}
  host:
    - if: osx
      # Require `__kmpc_dispatch_deinit` introduced in
      # https://github.com/llvm/llvm-project/pull/97065
      then: llvm-openmp ==19.1.0
      else: llvm-openmp ==9.0.1
    - mimalloc >=3.1.5,<4.0.0
    - if: osx and x86_64
      then: mimalloc <=3.2.8
    - nanobind >=2.12.0,<3.0.0
    - python-abi3 ${{ python }}.*
    - scikit-build-core >=0.11.3,<2.0.0
    - spdlog >=1.16.0,<2.0.0
    - if: x86_64 and not osx
      then: tbb-devel ==2022.2.0  # For hybrid CPU support
      else: tbb-devel ==2021.6.0
    - uv >=0.10.2
  run:
    - annotated-types >=0.7.0,<2.0.0
    - executing >=2.2.1,<3.0.0
    - metpy >=1.7.0,<2.0.0
    - numba >=0.61.2,<2.0.0
    - if: osx and x86_64
      then: numba <0.63.0
    - numpy >=2.2.0,<3.0.0
    - numpy-allocator >=1.2.1,<2.0.0
    - numpy-typing-compat >=20250818.2.2
    - optype-numpy >=0.13.3,<2.0.0
    - pint >=0.26.1,<2.0.0
    - pydantic >=2.12.4,<4.0.0
    - python
    - spydlog >=1.0.1,<2.0.0
    - tbb <2024.0.0
    - typing-extensions >=4.16.0,<5.0.0
  run_exports:
    - ${{ pin_subpackage(name, upper_bound="x.x.x") }}

about:
  homepage: ${{ load_from_file("../../pyproject.toml").project.urls.Homepage }}
  license: ${{ load_from_file("../../pyproject.toml").project.license }}
  summary: ${{ load_from_file("../../pyproject.toml").project.description }}
  repository: ${{ load_from_file("../../pyproject.toml").project.urls["Source Code"] }}
