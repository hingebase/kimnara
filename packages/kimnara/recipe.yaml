context:
  name: ${{ load_from_file("../../pyproject.toml").project.name }}

package:
  name: ${{ name }}
  version: ${{ load_from_file("../../pyproject.toml").project.version }}

source:
  path: ../..

build:
  number: 0
  script:
    - if: unix
      then: test ! -d .pixi
    - uv pip install --no-deps --no-build-isolation -vv --system .
  python:
    version_independent: ${{ match(python, ">=3.12.0") }}

requirements:
  build:
    # https://discourse.cmake.org/t/cmake-3-28-cmake-cxx-compiler-clang-scan-deps-notfound-not-found/9244
    - if: osx
      then: clang-tools
    - cmake >=4.0.0
    - ${{ compiler("cxx") }}
    - ninja >=1.11.1,<2.0.0
    - ${{ stdlib("c") }}
    - if: microarch_level|int > 0
      then: x86_64-microarch-level ==${{ microarch_level }}
  host:
    - if: osx
      # __kmpc_dispatch_deinit in https://github.com/llvm/llvm-project/pull/97065
      then: llvm-openmp ==19.1.0
      else: llvm-openmp ==9.0.1
    - mimalloc >=3.1.5,<4.0.0
    - if: osx and x86_64
      then: mimalloc <=3.2.8
    - nanobind >=2.10.2,<3.0.0
    - if: match(python, ">=3.12.0")
      then: python-abi3 ${{ python }}.*
      else: python ${{ python }}.*
    - python-gil ${{ python }}.*
    - scikit-build-core >=0.11.3,<2.0.0
    - spdlog >=1.16.0,<2.0.0
    - if: x86_64 and not osx
      then: tbb-devel ==2022.2.0  # For hybrid CPU support
      else: tbb-devel ==2021.6.0
    - uv >=0.10.2
  run:
    - annotated-types >=0.7.0,<2.0.0
    - if: match(python, "3.10.*")
      then: exceptiongroup >=1.3.0,<2.0.0
    - metpy >=1.7.0,<2.0.0
    - numba >=0.57.0,<2.0.0
    - if: osx and x86_64
      then: numba <0.63.0
    - numpy >=1.24.0,<3.0.0
    - numpy-allocator >=1.2.1,<2.0.0
    - numpy-typing-compat >=20250818.1.23
    - if: match(python, ">=3.12.0")
      then: optype-numpy >=0.13.3,<2.0.0
    - if: match(python, "3.11.*")
      then:
        - optype >=0.9.2,<0.10.0 [when="numpy 1.24.*"]
        - optype-numpy >=0.13.3,<2.0.0 [when="numpy >=1.25.0"]
    - if: match(python, "3.10.*")
      then: optype >=0.9.2,<0.10.0
    - pint >=0.24.4,<2.0.0
    - pydantic >=2.12.4,<4.0.0
    - python
    - spydlog >=1.0.1,<2.0.0
    - tbb <2024.0.0
    - typing-extensions >=4.16.0,<5.0.0
  run_constraints:
    - if: match(python, "3.11.*")
      then: matplotlib-base <=3.10.9 [when="numpy 1.24.*"]
    - if: match(python, ">=3.11.0")
      then: scipy <=1.16.3 [when="numpy <1.26.4"]
  run_exports:
    - ${{ pin_subpackage(name) }}

about:
  homepage: ${{ load_from_file("../../pyproject.toml").project.urls.Homepage }}
  license: ${{ load_from_file("../../pyproject.toml").project.license }}
  summary: ${{ load_from_file("../../pyproject.toml").project.description }}
  repository: ${{ load_from_file("../../pyproject.toml").project.urls["Source Code"] }}
