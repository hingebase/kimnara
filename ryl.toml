[files]
yaml = [
    ".clangd",
    ".github/**/*.yaml",
    ".github/**/*.yml",
    "packages/**/*.yaml",
    "packages/**/*.yml",
]

[[per-line-ignores]]
regex = '\$\{\{'
rules = ["line-length"]

[rules]
block-scalar-chomping = "disable"
braces = { forbid = true }
brackets = { forbid = true }
colons = "enable"
commas = "enable"
comments = "enable"
comments-indentation = "enable"
document-end = { present = false }
document-start = "disable"
empty-lines = "enable"
empty-values = "enable"
hyphens = "enable"
indentation = { check-multi-line-strings = true, spaces = 2 }
key-ordering = "disable"
line-length = "enable"
merge-keys = "enable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
octal-values = "enable"
tags = { forbid-removed-types = true, forbid-unsafe-tags = true }
trailing-spaces = "enable"
truthy = { check-keys = false }
unicode-line-breaks = "enable"

[rules.anchors]
forbid-ambiguous-anchor-alias-names = true
forbid-duplicated-anchors = true
forbid-unused-anchors = true

[rules.float-values]
forbid-inf = true
forbid-nan = true
forbid-scientific-notation = true
require-numeral-before-decimal = true

[rules.key-duplicates]
check-canonical = true
forbid-duplicated-merge-keys = true
forbid-merge-key-shadowing = true

[rules.quoted-strings]
check-keys = true
quote-type = "double"
required = "only-when-needed"
