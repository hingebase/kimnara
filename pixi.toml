# This should match the minimum supported Pixi version
#:schema https://pixi.prefix.dev/v0.84.1/schema/manifest/schema.json

[workspace]
channels = ["conda-forge"]
platforms = [
    "linux-64",
    "linux-aarch64",
    { platform = "osx-64", macos = "10.15" },
    { platform = "osx-arm64", macos = "11.0" },
    "win-64",
]
preview = ["pixi-build"]
requires-pixi = ">=0.84.1"

[workspace.dependencies]
clang-tools = ">=21.1.0"
kimnara = { path = "packages/kimnara" }
ruff = ">=0.17.6"
ryl = ">=0.30.0"
spydlog = { path = "packages/spydlog" }
tombi = ">=1.11.3"

[workspace.build-variants]
python = ["3.12"]

[workspace.target]
linux-64 = { build-variants = { microarch_level = ["1"] } }
linux-aarch64 = { build-variants = { microarch_level = ["0"] } }
osx = { build-variants = { cxx_compiler = ["clangxx"] } }

[workspace.target.linux.build-variants]
cxx_compiler = ["gxx"]
cxx_compiler_version = ["16.2"]

[workspace.target.osx-64.build-variants]
cxx_compiler_version = ["21.1"]
microarch_level = ["1"]

[workspace.target.osx-arm64.build-variants]
cxx_compiler_version = ["23.1"]
microarch_level = ["0"]

[workspace.target.win.build-variants]
c_stdlib = ["vs"]
c_stdlib_version = ["2026.1"]
cxx_compiler = ["vs"]
cxx_compiler_version = ["2026.1"]
microarch_level = ["1"]

[dependencies]
basedpyright = ">=1.40.2"
hypothesis = ">=6.155.7"
pandas-stubs = ">=1.4.2,<4.0.0"
pytest = ">=9.2.0"
scipy-stubs = ">=1.14.1,<2.0.0"
test-package-cmake = { path = "packages/test-package-cmake" }
uv = ">=0.10.2"

# For each minor version of NumPy, the convex hull of compatible minor
# (Python, Numba) versions is obtained, and all the vertices of the convex hull
# are tested.
[environments]
default = ["py312", "np22", "nb061", "tests"]
py312np22 = ["py312", "np22", "nb"]
py312np23 = ["py312", "np23", "nb"]
py312np23nb062 = ["py312", "np23", "nb062"]
py312np24 = ["py312", "np24", "nb"]
py312np24nb064 = ["py312", "np24", "nb064"]
py312np25 = ["py312", "np25", "nb"]
py312np25nb067 = ["py312", "np25", "nb067"]
py313np22 = ["py313", "np22", "nb"]
py313np22nb061 = ["py313", "np22", "nb061"]
py313np23nb062 = ["py313", "np23", "nb062"]
py314np23 = ["py314", "np23", "nb"]
py314np23nb063 = ["py314", "np23", "nb063"]
py314np24 = ["py314", "np24", "nb"]
py314np24nb064 = ["py314", "np24", "nb064"]
py314np25nb067 = ["py314", "np25", "nb067"]
py315np25 = ["py315", "np25", "nb"]

[feature]
# One variant per directory, see
# https://github.com/numpy/numpy/tree/v2.5.0/pixi-packages
py312 = { dependencies = { python-gil = "3.12.*" } }
py313 = { dependencies = { python-gil = "3.13.*" } }
np22 = { dependencies = { numpy = "==2.2.6" } }
np23 = { dependencies = { numpy = "==2.3.5" } }
nb061 = { dependencies = { numba = "==0.61.2" } }
nb062 = { dependencies = { numba = "==0.62.1" } }

[feature.py314]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { python-gil = "3.14.*" }

[feature.py315]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { python-gil = "3.15.*" }

[feature.np24]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { numpy = "==2.4.6" }

[feature.np25]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { numpy = "2.5.*" }

[feature.nb063]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { numba = "==0.63.1" }

[feature.nb064]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { numba = "==0.64.0" }

[feature.nb067]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { numba = "==0.67.0" }

[feature.nb.target]
linux = { dependencies = { numba = ">=0.68.0" } }
osx-64 = { dependencies = { numba = "==0.62.1" } }
osx-arm64 = { dependencies = { numba = ">=0.68.0" } }
win-64 = { dependencies = { numba = ">=0.68.0" } }

[target]
linux-64 = { dependencies = { libblas = { build = "*_mkl" } } }
linux-aarch64 = { dependencies = { libblas = { build = "*_openblas" } } }
# https://conda-forge.org/news/2025/07/31/new-accelerate-macos/
osx = { dependencies = { libblas = { build = "*accelerate" } } }
win-64 = { dependencies = { libblas = { build = "*_mkl" } } }

[tasks]
pytest = "pytest -Werror"

[environments.clangd]
features = ["clangd"]
no-default-feature = true

[feature.clangd.dependencies]
cmake = ">=4.0.0"
llvm-openmp = ">=11.0.0"
mimalloc = ">=3.1.5,<4.0.0"
nanobind = ">=2.12.0,<3.0.0"
ninja = ">=1.11.1,<2.0.0"
python = ">=3.12.0"
spdlog = ">=1.16.0,<2.0.0"
tbb-devel = ">=2021.6.0,<=2023.1.0"

[feature.clangd.target]
linux-64 = { dependencies = { gxx_linux-64 = ">=16.2.0" } }
linux-aarch64 = { dependencies = { gxx_linux-aarch64 = ">=16.2.0" } }
osx-64 = { dependencies = { clangxx_osx-64 = ">=21.1.0" } }
osx-arm64 = { dependencies = { clangxx_osx-arm64 = ">=23.1.0" } }
# https://discourse.cmake.org/t/cmake-3-28-cmake-cxx-compiler-clang-scan-deps-notfound-not-found/9244
osx = { dependencies = { clang-tools = { workspace = true } } }

[feature.clangd.target.win-64.dependencies]
vs_win-64 = "2026.1.*"

[feature.clangd.target.win-64.activation.env]
CMAKE_GENERATOR_PLATFORM = ""  # tombi: lint.rules.string-min-length.disabled = true
CMAKE_GENERATOR_TOOLSET = ""  # tombi: lint.rules.string-min-length.disabled = true

[feature.clangd.tasks.configure]
cmd = "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -GNinja"
inputs = [
    "CMakeLists.txt",
    "src/kimnara/_spec/_numpy/_units/CMakeLists.txt",
    "src/kimnara/align/CMakeLists.txt",
    "src/kimnara/cmake/kimnara-config.cmake.in",
    "src/kimnara/lib/CMakeLists.txt",
    "src/kimnara/logging/CMakeLists.txt",
    "src/kimnara/threading/CMakeLists.txt",
]
# We don't care about other outputs
outputs = ["build/compile_commands.json"]

[feature.tests]
channels = ["conda-forge", "https://prefix.dev/github-releases", "conda-pypi"]

[feature.tests.dependencies]
clang-tools = { workspace = true }
clangd-tidy = { version = ">=1.1.1", channel = "conda-pypi" }

[feature.tests.target.linux.dependencies]
clang-23 = "*"
ruff = { workspace = true }
ryl = { workspace = true }
tombi = { workspace = true }

[feature.tests.target.osx-64.dependencies]
clang-21 = "*"
ruff = { version = ">=0.17.6", channel = "https://prefix.dev/github-releases" }
tombi = { version = ">=1.11.3", channel = "https://prefix.dev/github-releases" }

[feature.tests.target.osx-arm64.dependencies]
clang-23 = "*"
ruff = { workspace = true }
ryl = { workspace = true }
tombi = { workspace = true }

[feature.tests.target.win-64.dependencies]
ruff = { workspace = true }
ryl = { workspace = true }
tombi = { workspace = true }

[feature.tests.tasks]
test = [
    { task = "configure", environment = "clangd" },
    { task = "pytest", environment = "default" },
    { task = "pytest", environment = "py312np22" },
    { task = "pytest", environment = "py312np23" },
    { task = "pytest", environment = "py312np23nb062" },
    { task = "pytest", environment = "py312np24" },
    { task = "pytest", environment = "py312np24nb064" },
    { task = "pytest", environment = "py312np25" },
    { task = "pytest", environment = "py312np25nb067" },
    { task = "pytest", environment = "py313np22" },
    { task = "pytest", environment = "py313np22nb061" },
    { task = "pytest", environment = "py313np23nb062" },
    { task = "pytest", environment = "py314np23" },
    { task = "pytest", environment = "py314np23nb063" },
    { task = "pytest", environment = "py314np24" },
    { task = "pytest", environment = "py314np24nb064" },
    { task = "pytest", environment = "py314np25nb067" },
    { task = "pytest", environment = "py315np25" },
]

[feature.tests.target.osx-64.tasks]
test = [
    { task = "configure", environment = "clangd" },
    { task = "pytest", environment = "default" },
    { task = "pytest", environment = "py312np22" },
    { task = "pytest", environment = "py312np23" },
    { task = "pytest", environment = "py313np22" },
    { task = "pytest", environment = "py313np22nb061" },
    { task = "pytest", environment = "py313np23nb062" },
]
