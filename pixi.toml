    { task = "pytest", environment = "py314np24" },
    { task = "pytest", environment = "py314np24nb064" },
    { task = "pytest", environment = "py314np25" },
]

[feature.tests.target.osx-64.tasks]
test = [
    { task = "pytest", environment = "default" },
    { task = "pytest", environment = "py310np124" },
    { task = "pytest", environment = "py310np125" },
    { task = "pytest", environment = "py310np125nb058" },
