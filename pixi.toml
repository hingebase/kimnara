# This should match the minimum supported Pixi version
#:schema https://pixi.prefix.dev/v0.71.0/schema/manifest/schema.json

[workspace]
channels = ["conda-forge"]
platforms = [
    "linux-64",
    "linux-aarch64",
    { platform = "osx-64", macos = "10.15" },
    { platform = "osx-arm64", macos = "11.0" },
    "win-64",
]
preview = ["pixi-build"]
requires-pixi = ">=0.71.0"

[workspace.dependencies]
kimnara = { path = "packages/kimnara" }
spydlog = { path = "packages/spydlog" }

[workspace.target]
linux-64 = { build-variants = { microarch_level = ["1"] } }
linux-aarch64 = { build-variants = { microarch_level = ["0"] } }
osx = { build-variants = { cxx_compiler = ["clangxx"] } }

[workspace.target.linux.build-variants]
cxx_compiler = ["gxx"]
cxx_compiler_version = ["16.2"]

[workspace.target.osx-64.build-variants]
cxx_compiler_version = ["21.1"]
microarch_level = ["1"]

[workspace.target.osx-arm64.build-variants]
cxx_compiler_version = ["23.1"]
microarch_level = ["0"]

[workspace.target.win.build-variants]
c_stdlib = ["vs"]
c_stdlib_version = ["2026.1"]
cxx_compiler = ["vs"]
cxx_compiler_version = ["2026.1"]
microarch_level = ["1"]

[dependencies]
basedpyright = ">=1.39.10"
hypothesis = ">=6.155.7"
pandas-stubs = ">=1.4.2,<4.0.0"
scipy-stubs = ">=1.14.1,<2.0.0"
pytest = ">=9.1.1"
uv = ">=0.10.2"

[environments]
default = ["py310", "np124", "nb057", "tests"]
py310np124 = ["py310", "np124", "nb"]
py310np125 = ["py310", "np125", "nb"]
py310np125nb058 = ["py310", "np125", "nb058"]
py310np126 = ["py310", "np126", "nb"]
py310np126nb058 = ["py310", "np126", "nb058"]
py310np20 = ["py310", "np20", "nb"]
py310np20nb060 = ["py310", "np20", "nb060"]
py310np21 = ["py310", "np21", "nb"]
py310np21nb061 = ["py310", "np21", "nb061"]
py310np22 = ["py310", "np22", "nb"]
py310np22nb061 = ["py310", "np22", "nb061"]
py311np124 = ["py311", "np124", "nb"]
py311np124nb057 = ["py311", "np124", "nb057"]
py311np125 = ["py311", "np125", "nb"]
py311np125nb058 = ["py311", "np125", "nb058"]
py311np126nb058 = ["py311", "np126", "nb058"]
py311np23 = ["py311", "np23", "nb"]
py311np23nb062 = ["py311", "np23", "nb062"]
py311np24 = ["py311", "np24", "nb"]
py311np24nb064 = ["py311", "np24", "nb064"]
py312np126 = ["abi3", "py312", "np126", "nb"]
py312np126nb059 = ["abi3", "py312", "np126", "nb059"]
py312np20 = ["abi3", "py312", "np20", "nb"]
py312np20nb060 = ["abi3", "py312", "np20", "nb060"]
py312np25 = ["abi3", "py312", "np25", "nb"]
py313np21 = ["abi3", "py313", "np21", "nb"]
py313np21nb061 = ["abi3", "py313", "np21", "nb061"]
py313np22 = ["abi3", "py313", "np22", "nb"]
py313np22nb061 = ["abi3", "py313", "np22", "nb061"]
py313np23nb062 = ["abi3", "py313", "np23", "nb062"]
py314np23 = ["abi3", "py314", "np23", "nb"]
py314np23nb063 = ["abi3", "py314", "np23", "nb063"]
py314np24 = ["abi3", "py314", "np24", "nb"]
py314np24nb064 = ["abi3", "py314", "np24", "nb064"]
py314np25 = ["abi3", "py314", "np25", "nb"]

[feature]
# One variant per directory, see
# https://github.com/numpy/numpy/tree/v2.5.0/pixi-packages
abi3 = { dependencies = { test-package-cmake = { path = "packages/test-package-cmake" } } }
py310 = { dependencies = { test-package-cmake = { path = "packages/test-package-cmake-py310" } } }
py311 = { dependencies = { test-package-cmake = { path = "packages/test-package-cmake-py311" } } }
py312 = { dependencies = { python-gil = "3.12.*" } }
py313 = { dependencies = { python-gil = "3.13.*" } }
np124 = { dependencies = { numpy = "==1.24.4" } }
np125 = { dependencies = { numpy = "==1.25.2" } }
np126 = { dependencies = { numpy = "==1.26.4" } }
np20 = { dependencies = { numpy = "==2.0.2" } }
np21 = { dependencies = { numpy = "==2.1.3" } }
np22 = { dependencies = { numpy = "==2.2.6" } }
np23 = { dependencies = { numpy = "==2.3.5" } }
nb057 = { dependencies = { numba = "==0.57.1" } }
nb058 = { dependencies = { numba = "==0.58.1" } }
nb059 = { dependencies = { numba = "==0.59.1" } }
nb060 = { dependencies = { numba = "==0.60.0" } }
nb061 = { dependencies = { numba = "==0.61.2" } }
nb062 = { dependencies = { numba = "==0.62.1" } }

[feature.py314]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { python-gil = "3.14.*" }

[feature.np24]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { numpy = "==2.4.6" }

[feature.np25]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { numpy = "2.5.*" }

[feature.nb063]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { numba = "==0.63.1" }

[feature.nb064]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-macos-11-0", "win-64"]
dependencies = { numba = "==0.64.0" }

[feature.nb.target]
linux = { dependencies = { numba = ">=0.67.0" } }
osx-64 = { dependencies = { numba = "==0.62.1" } }
osx-arm64 = { dependencies = { numba = ">=0.67.0" } }
win-64 = { dependencies = { numba = ">=0.67.0" } }

[target]
linux-64 = { dependencies = { libblas = { build = "*_mkl" } } }
linux-aarch64 = { dependencies = { libblas = { build = "*_openblas" } } }
# https://conda-forge.org/news/2025/07/31/new-accelerate-macos/
osx = { dependencies = { libblas = { build = "*accelerate" } } }
win-64 = { dependencies = { libblas = { build = "*_mkl" } } }

[tasks]
pytest = "pytest -Werror"

[environments.clangd]
features = ["clangd"]
no-default-feature = true

[feature.clangd.dependencies]
cmake = ">=4.0.0"
llvm-openmp = ">=11.0.0"
mimalloc = ">=3.1.5,<4.0.0"
nanobind = ">=2.12.0,<3.0.0"
ninja = ">=1.11.1,<2.0.0"
python = ">=3.10.0"
spdlog = ">=1.16.0,<2.0.0"
tbb-devel = ">=2021.6.0,<2024.0.0"

[feature.clangd.target]
linux-64 = { dependencies = { gxx_linux-64 = ">=16.2.0" } }
linux-aarch64 = { dependencies = { gxx_linux-aarch64 = ">=16.2.0" } }
osx-64 = { dependencies = { clangxx_osx-64 = ">=21.1.0" } }
osx-arm64 = { dependencies = { clangxx_osx-arm64 = ">=23.1.0" } }
# https://discourse.cmake.org/t/cmake-3-28-cmake-cxx-compiler-clang-scan-deps-notfound-not-found/9244
osx = { dependencies = { clang-tools = ">=21.1.0" } }

[feature.clangd.target.win-64.dependencies]
vs_win-64 = "2026.1.*"

[feature.clangd.target.win-64.activation.env]
CMAKE_GENERATOR_PLATFORM = ""  # tombi: lint.rules.string-min-length.disabled = true
CMAKE_GENERATOR_TOOLSET = ""  # tombi: lint.rules.string-min-length.disabled = true

[feature.clangd.tasks.configure]
cmd = "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -GNinja"
inputs = [
    "CMakeLists.txt",
    "src/kimnara/_spec/_numpy/_units/CMakeLists.txt",
    "src/kimnara/align/CMakeLists.txt",
    "src/kimnara/cmake/kimnara-config.cmake.in",
    "src/kimnara/lib/CMakeLists.txt",
    "src/kimnara/logging/CMakeLists.txt",
    "src/kimnara/threading/CMakeLists.txt",
]
# We don't care about other outputs
outputs = ["build/compile_commands.json"]

[feature.tests]
channels = ["conda-forge", "https://prefix.dev/github-releases"]

[feature.tests.target.linux.dependencies]
ruff = ">=0.16.6"
ryl = ">=0.21.0"
tombi = ">=1.5.2"

[feature.tests.target.osx-64.dependencies]
ruff = { version = ">=0.16.6", channel = "https://prefix.dev/github-releases" }
tombi = { version = ">=1.5.2", channel = "https://prefix.dev/github-releases" }

[feature.tests.target.osx-arm64.dependencies]
ruff = ">=0.16.6"
ryl = ">=0.21.0"
tombi = ">=1.5.2"

[feature.tests.target.win-64.dependencies]
ruff = ">=0.16.6"
ryl = ">=0.21.0"
tombi = ">=1.5.2"

[feature.tests.tasks]
test = [
    { task = "pytest", environment = "default" },
    { task = "pytest", environment = "py310np124" },
    { task = "pytest", environment = "py310np125" },
    { task = "pytest", environment = "py310np125nb058" },
    { task = "pytest", environment = "py310np126" },
    { task = "pytest", environment = "py310np126nb058" },
    { task = "pytest", environment = "py310np20" },
    { task = "pytest", environment = "py310np20nb060" },
    { task = "pytest", environment = "py310np21" },
    { task = "pytest", environment = "py310np21nb061" },
    { task = "pytest", environment = "py310np22" },
    { task = "pytest", environment = "py310np22nb061" },
    { task = "pytest", environment = "py311np124" },
    { task = "pytest", environment = "py311np124nb057" },
