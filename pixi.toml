    { task = "pytest", environment = "py312np126nb059" },
    { task = "pytest", environment = "py312np20" },
    { task = "pytest", environment = "py312np20nb060" },
    { task = "pytest", environment = "py312np25" },
    { task = "pytest", environment = "py313np21" },
    { task = "pytest", environment = "py313np21nb061" },
